<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>未来農園 会員データベース</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Shippori+Mincho:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  :root {
    --green-50: #F2F7EC;
    --green-100: #DCF0C0;
    --green-200: #BADA8A;
    --green-400: #7DB84A;
    --green-600: #4A8022;
    --green-800: #2D5212;
    --amber-50: #FDF6E7;
    --amber-400: #E8A030;
    --teal-50: #E8F5F0;
    --teal-500: #2A9D72;
    --gray-50: #F8F6F2;
    --gray-100: #EDE9E2;
    --gray-200: #D8D2C8;
    --gray-400: #9E9588;
    --gray-600: #5E5850;
    --gray-800: #2E2B26;
    --bg: #F5F2EC;
    --card: #FDFCF9;
    --radius: 14px;
    --radius-sm: 8px;
    --shadow: 0 2px 12px rgba(46,43,38,0.07);
    --shadow-hover: 0 6px 24px rgba(46,43,38,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    background: var(--bg);
    color: var(--gray-800);
    min-height: 100vh;
    padding-bottom: 3rem;
  }

  /* Header */
  .header {
    background: var(--green-800);
    padding: 2rem 2rem 1.5rem;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 200px; height: 200px;
    border-radius: 50%;
    background: rgba(255,255,255,0.04);
  }
  .header::after {
    content: '';
    position: absolute;
    bottom: -60px; left: 30%;
    width: 280px; height: 280px;
    border-radius: 50%;
    background: rgba(255,255,255,0.03);
  }
  .header-inner {
    max-width: 960px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }
  .header-label {
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--green-200);
    text-transform: uppercase;
    margin-bottom: 6px;
    font-family: 'Shippori Mincho', serif;
  }
  .header-title {
    font-size: 26px;
    font-weight: 700;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header-title i { font-size: 24px; opacity: 0.85; }
  .header-sub {
    font-size: 13px;
    color: rgba(255,255,255,0.5);
    margin-top: 6px;
  }

  /* Main */
  .main {
    max-width: 960px;
    margin: 0 auto;
    padding: 1.5rem 1.25rem 0;
  }

  /* Controls */
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 1.25rem;
    align-items: center;
  }
  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 180px;
  }
  .search-wrap i {
    position: absolute;
    left: 10px; top: 50%;
    transform: translateY(-50%);
    color: var(--gray-400);
    font-size: 16px;
  }
  .search-wrap input {
    width: 100%;
    padding: 9px 12px 9px 34px;
    border: 1.5px solid var(--gray-200);
    border-radius: var(--radius-sm);
    background: var(--card);
    font-family: inherit;
    font-size: 13px;
    color: var(--gray-800);
    outline: none;
    transition: border-color 0.2s;
  }
  .search-wrap input:focus { border-color: var(--green-400); }
  .search-wrap input::placeholder { color: var(--gray-400); }

  select {
    padding: 9px 12px;
    border: 1.5px solid var(--gray-200);
    border-radius: var(--radius-sm);
    background: var(--card);
    font-family: inherit;
    font-size: 13px;
    color: var(--gray-800);
    outline: none;
    cursor: pointer;
  }
  select:focus { border-color: var(--green-400); }

  .view-toggle {
    display: flex;
    border: 1.5px solid var(--gray-200);
    border-radius: var(--radius-sm);
    overflow: hidden;
    background: var(--card);
  }
  .view-btn {
    padding: 8px 12px;
    border: none;
    background: transparent;
    cursor: pointer;
    color: var(--gray-400);
    font-size: 16px;
    display: flex;
    align-items: center;
    transition: all 0.15s;
  }
  .view-btn.active {
    background: var(--green-800);
    color: #fff;
  }

  /* Stats */
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 1.25rem;
  }
  .stat {
    background: var(--card);
    border-radius: var(--radius);
    padding: 14px 16px;
    border: 1px solid var(--gray-100);
    box-shadow: var(--shadow);
  }
  .stat-label {
    font-size: 11px;
    color: var(--gray-400);
    margin-bottom: 4px;
    font-family: 'Shippori Mincho', serif;
    letter-spacing: 0.05em;
  }
  .stat-val {
    font-size: 28px;
    font-weight: 700;
    color: var(--green-800);
    line-height: 1;
  }
  .stat-sub { font-size: 11px; color: var(--gray-400); margin-top: 3px; }

  /* Cards */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 12px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--gray-100);
    border-radius: var(--radius);
    padding: 16px 18px;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-hover);
    border-color: var(--green-200);
  }

  .card-top {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .avatar {
    width: 44px; height: 44px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700;
    flex-shrink: 0;
    font-family: 'Shippori Mincho', serif;
  }
  .avatar.staff { background: var(--green-100); color: var(--green-800); }
  .avatar.member { background: var(--teal-50); color: var(--teal-500); }

  .card-name { font-size: 16px; font-weight: 700; color: var(--gray-800); }
  .card-line { font-size: 12px; color: var(--gray-400); margin-top: 2px; }

  .badges {
    display: flex; flex-wrap: wrap; gap: 5px;
    margin-bottom: 12px;
  }
  .badge {
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 20px;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 3px;
  }
  .badge-staff { background: var(--green-100); color: var(--green-800); }
  .badge-member { background: var(--teal-50); color: var(--teal-500); }
  .badge-role { background: var(--gray-100); color: var(--gray-600); }
  .badge-car { background: var(--amber-50); color: var(--amber-400); }

  .skills {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
    padding: 10px 0 0;
    border-top: 1px solid var(--gray-100);
  }
  .skill-item { text-align: center; }
  .skill-name { font-size: 10px; color: var(--gray-400); margin-bottom: 3px; }
  .stars { font-size: 12px; color: var(--green-400); line-height: 1.2; }
  .stars .empty { color: var(--gray-200); }

  .freq-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--gray-100);
  }
  .freq-label { font-size: 11px; color: var(--gray-400); }
  .dots { display: flex; gap: 3px; }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--gray-200);
  }
  .dot.on { background: var(--green-400); }

  /* List view */
  .list-wrap { overflow-x: auto; }
  table {
    width: 100%; border-collapse: collapse;
    background: var(--card);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    font-size: 13px;
  }
  th {
    background: var(--green-800);
    color: rgba(255,255,255,0.8);
    font-size: 11px;
    font-weight: 500;
    padding: 10px 12px;
    text-align: left;
    white-space: nowrap;
    letter-spacing: 0.04em;
    font-family: 'Shippori Mincho', serif;
  }
  td {
    padding: 11px 12px;
    border-bottom: 1px solid var(--gray-100);
    color: var(--gray-800);
    vertical-align: middle;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--green-50); cursor: pointer; }
  .td-stars { color: var(--green-400); white-space: nowrap; font-size: 12px; }

  /* Modal */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(46,43,38,0.45);
    display: none; align-items: center; justify-content: center;
    z-index: 100;
    padding: 1rem;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--card);
    border-radius: var(--radius);
    width: 440px; max-width: 100%;
    max-height: 90vh; overflow-y: auto;
    padding: 22px 24px;
    box-shadow: 0 16px 48px rgba(46,43,38,0.2);
    position: relative;
  }
  .modal-close {
    position: absolute; top: 14px; right: 14px;
    background: var(--gray-100); border: none;
    border-radius: 50%; width: 30px; height: 30px;
    cursor: pointer; color: var(--gray-600);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    transition: background 0.15s;
  }
  .modal-close:hover { background: var(--gray-200); }
  .modal-header {
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 16px;
  }
  .modal-name { font-size: 20px; font-weight: 700; }
  .modal-line { font-size: 13px; color: var(--gray-400); margin-top: 2px; }
  .modal-section {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--gray-100);
  }
  .modal-section-label {
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--gray-400);
    font-family: 'Shippori Mincho', serif;
    margin-bottom: 10px;
  }
  .modal-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px;
  }
  .modal-row-label { font-size: 13px; color: var(--gray-600); }
  .modal-row-val { font-size: 13px; font-weight: 600; color: var(--gray-800); }
  .skill-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 6px;
  }
  .skill-row-label { font-size: 13px; color: var(--gray-600); }
  .skill-row-stars { font-size: 16px; color: var(--green-400); }
  .skill-row-stars .empty { color: var(--gray-200); }
  .skill-legend {
    margin-top: 8px;
    font-size: 11px; color: var(--gray-400);
    background: var(--gray-50);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    line-height: 1.8;
  }
  .memo-box {
    background: var(--green-50);
    border-left: 3px solid var(--green-400);
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    padding: 10px 12px;
    font-size: 13px;
    color: var(--gray-700);
    line-height: 1.6;
  }

  .no-result {
    text-align: center;
    padding: 3rem;
    color: var(--gray-400);
    font-size: 14px;
  }

  /* Responsive */
  @media (max-width: 600px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .header-title { font-size: 20px; }
    .stat-val { font-size: 22px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="header-label">Miraien Farm</div>
    <div class="header-title">
      <i class="ti ti-users"></i>
      未来農園 会員データベース
    </div>
    <div class="header-sub">スタッフ共有用 — 閲覧専用</div>
  </div>
</div>

<div class="main">
  <div class="controls">
    <div class="search-wrap">
      <i class="ti ti-search"></i>
      <input type="text" id="search" placeholder="名前・役割・興味で検索...">
    </div>
    <select id="filter-type">
      <option value="all">全員</option>
      <option value="スタッフ">スタッフ</option>
      <option value="会員">会員</option>
    </select>
    <select id="filter-car">
      <option value="all">車出し全て</option>
      <option value="car">車出し可のみ</option>
    </select>
    <div class="view-toggle">
      <button class="view-btn active" id="btn-grid" onclick="setView('grid')" title="カード表示">
        <i class="ti ti-layout-grid"></i>
      </button>
      <button class="view-btn" id="btn-list" onclick="setView('list')" title="リスト表示">
        <i class="ti ti-list"></i>
      </button>
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <div id="grid-view" class="grid"></div>
  <div id="list-view" class="list-wrap" style="display:none">
    <table>
      <thead>
        <tr>
          <th>名前</th><th>区分</th><th>役割</th>
          <th>草刈り</th><th>畑</th><th>加工</th><th>農機具</th><th>養鶏</th>
          <th>車出し</th><th>送迎</th>
        </tr>
      </thead>
      <tbody id="list-body"></tbody>
    </table>
  </div>
  <div class="no-result" id="no-result" style="display:none">該当する会員が見つかりません 🌱</div>
</div>

<div class="overlay" id="overlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <button class="modal-close" onclick="closeOverlay()"><i class="ti ti-x"></i></button>
    <div id="modal-content"></div>
  </div>
</div>

<script>
const members = [
  {
    nick:"よう", line:"よう", type:"スタッフ", role:"スーパーサブ",
    interest:"イベント企画", dislike:"", skill:"コミュニケーション",
    car:"⭕️ 3人 両方", ride:"なし", freq:4,
    levels:{草刈り:0, 畑:0, 加工:0, 農機具:0, 養鶏:1},
    memo:""
  },
  {
    nick:"ひで", line:"ひで", type:"会員", role:"恩送り会員",
    interest:"草刈り", dislike:"", skill:"草刈り",
    car:"⭕️ 5人 両方", ride:"なし", freq:3,
    levels:{草刈り:1, 畑:1, 加工:1, 農機具:1, 養鶏:1},
    memo:""
  },
  {
    nick:"やよい", line:"yayoi", type:"会員", role:"恩送り会員",
    interest:"収穫", dislike:"力仕事", skill:"",
    car:"", ride:"あり", freq:2,
    levels:{草刈り:1, 畑:1, 加工:1, 農機具:1, 養鶏:1},
    memo:""
  },
  {
    nick:"林", line:"林知里", type:"会員", role:"恩送り会員",
    interest:"", dislike:"養鶏", skill:"",
    car:"⭕️ 2〜3人 朝のみ", ride:"なし", freq:2,
    levels:{草刈り:2, 畑:3, 加工:0, 農機具:2, 養鶏:0},
    memo:""
  }
];

const skillKeys = ["草刈り","畑","加工","農機具","養鶏"];

function initials(nick) { return nick.slice(0,2); }

function stars(n, big=false) {
  const size = big ? 'font-size:17px' : '';
  let s = '';
  for(let i=1;i<=3;i++) s += `<span style="${size}" class="${i<=n?'':'empty'}">★</span>`;
  return s;
}

function freqLabel(f) {
  return ["","月1回","月2回","月2〜3回","週1以上"][f] || "";
}

function hasCar(m) { return m.car && m.car.includes('⭕️'); }

function renderStats(list) {
  const staff = list.filter(m=>m.type==='スタッフ').length;
  const car = list.filter(m=>hasCar(m)).length;
  const ride = list.filter(m=>m.ride==='あり').length;
  document.getElementById('stats').innerHTML = `
    <div class="stat">
      <div class="stat-label">会員合計</div>
      <div class="stat-val">${list.length}</div>
      <div class="stat-sub">名</div>
    </div>
    <div class="stat">
      <div class="stat-label">スタッフ</div>
      <div class="stat-val">${staff}</div>
      <div class="stat-sub">/ 会員 ${list.length-staff}名</div>
    </div>
    <div class="stat">
      <div class="stat-label">車出し可</div>
      <div class="stat-val">${car}</div>
      <div class="stat-sub">名</div>
    </div>
    <div class="stat">
      <div class="stat-label">送迎希望</div>
      <div class="stat-val">${ride}</div>
      <div class="stat-sub">名</div>
    </div>
  `;
}

function renderCards(list) {
  const el = document.getElementById('grid-view');
  el.innerHTML = list.map((m,i) => `
    <div class="card" onclick="openModal(${members.indexOf(m)})" style="animation-delay:${i*0.04}s">
      <div class="card-top">
        <div class="avatar ${m.type==='スタッフ'?'staff':'member'}">${initials(m.nick)}</div>
        <div>
          <div class="card-name">${m.nick}</div>
          <div class="card-line">${m.line}</div>
        </div>
      </div>
      <div class="badges">
        <span class="badge ${m.type==='スタッフ'?'badge-staff':'badge-member'}">${m.type}</span>
        ${m.role?`<span class="badge badge-role">${m.role}</span>`:''}
        ${hasCar(m)?`<span class="badge badge-car"><i class="ti ti-car" style="font-size:11px"></i>${m.car}</span>`:''}
      </div>
      <div class="skills">
        ${skillKeys.map(k=>`
          <div class="skill-item">
            <div class="skill-name">${k}</div>
            <div class="stars">${m.levels[k]>0?stars(m.levels[k]):'<span class="empty" style="font-size:11px">—</span>'}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

function renderList(list) {
  document.getElementById('list-body').innerHTML = list.map(m => `
    <tr onclick="openModal(${members.indexOf(m)})">
      <td><strong>${m.nick}</strong><br><span style="font-size:11px;color:#9E9588">${m.line}</span></td>
      <td><span class="badge ${m.type==='スタッフ'?'badge-staff':'badge-member'}" style="font-size:10px">${m.type}</span></td>
      <td style="color:#5E5850;font-size:12px">${m.role}</td>
      ${skillKeys.map(k=>`<td class="td-stars">${m.levels[k]>0?stars(m.levels[k]):'—'}</td>`).join('')}
      <td style="font-size:12px">${m.car||'—'}</td>
      <td style="font-size:12px">${m.ride||'—'}</td>
    </tr>
  `).join('');
}

let currentView = 'grid';
function setView(v) {
  currentView = v;
  document.getElementById('grid-view').style.display = v==='grid'?'grid':'none';
  document.getElementById('list-view').style.display = v==='list'?'block':'none';
  document.getElementById('btn-grid').classList.toggle('active', v==='grid');
  document.getElementById('btn-list').classList.toggle('active', v==='list');
  render();
}

function getFiltered() {
  const q = document.getElementById('search').value.toLowerCase();
  const t = document.getElementById('filter-type').value;
  const c = document.getElementById('filter-car').value;
  return members.filter(m => {
    const text = [m.nick,m.line,m.role,m.interest,m.skill,m.dislike].join(' ').toLowerCase();
    return (!q||text.includes(q)) &&
           (t==='all'||m.type===t) &&
           (c==='all'||(c==='car'&&hasCar(m)));
  });
}

function render() {
  const list = getFiltered();
  renderStats(list);
  const noRes = document.getElementById('no-result');
  if(!list.length) { noRes.style.display='block'; document.getElementById('grid-view').innerHTML=''; document.getElementById('list-body').innerHTML=''; return; }
  noRes.style.display='none';
  if(currentView==='grid') renderCards(list);
  else renderList(list);
}

function openModal(idx) {
  const m = members[idx];
  document.getElementById('modal-content').innerHTML = `
    <div class="modal-header">
      <div class="avatar ${m.type==='スタッフ'?'staff':'member'}" style="width:50px;height:50px;font-size:15px">${initials(m.nick)}</div>
      <div>
        <div class="modal-name">${m.nick}</div>
        <div class="modal-line">${m.line}</div>
      </div>
    </div>
    <div class="badges">
      <span class="badge ${m.type==='スタッフ'?'badge-staff':'badge-member'}">${m.type}</span>
      ${m.role?`<span class="badge badge-role">${m.role}</span>`:''}
      ${hasCar(m)?`<span class="badge badge-car"><i class="ti ti-car" style="font-size:11px"></i>${m.car}</span>`:''}
    </div>

    <div class="modal-section">
      <div class="modal-section-label">活動情報</div>
      ${m.interest?`<div class="modal-row"><span class="modal-row-label">興味分野</span><span class="modal-row-val">${m.interest}</span></div>`:''}
      ${m.dislike?`<div class="modal-row"><span class="modal-row-label">苦手分野</span><span class="modal-row-val">${m.dislike}</span></div>`:''}
      ${m.skill?`<div class="modal-row"><span class="modal-row-label">スキル</span><span class="modal-row-val">${m.skill}</span></div>`:''}
      <div class="modal-row"><span class="modal-row-label">送迎希望</span><span class="modal-row-val">${m.ride||'なし'}</span></div>
      ${m.freq?`<div class="modal-row"><span class="modal-row-label">活動頻度</span><span class="modal-row-val">${freqLabel(m.freq)}</span></div>`:''}
    </div>

    <div class="modal-section">
      <div class="modal-section-label">スキルレベル</div>
      ${skillKeys.map(k=>`
        <div class="skill-row">
          <span class="skill-row-label">${k}</span>
          <span class="skill-row-stars">${m.levels[k]>0?stars(m.levels[k],true):'<span class="empty">未経験</span>'}</span>
        </div>
      `).join('')}
      <div class="skill-legend">
        ★ 一人でできる　★★ 教えられる　★★★ 育成できる
      </div>
    </div>

    ${m.memo?`
    <div class="modal-section">
      <div class="modal-section-label">メモ</div>
      <div class="memo-box">${m.memo}</div>
    </div>`:''}
  `;
  document.getElementById('overlay').classList.add('open');
}

function closeModal(e) { if(e.target===document.getElementById('overlay')) closeOverlay(); }
function closeOverlay() { document.getElementById('overlay').classList.remove('open'); }

document.getElementById('search').addEventListener('input', render);
document.getElementById('filter-type').addEventListener('change', render);
document.getElementById('filter-car').addEventListener('change', render);

render();
</script>
</body>
</html>
